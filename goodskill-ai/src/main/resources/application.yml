server:
  port: 18077

spring:
  application:
    name: goodskill-ai
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"
          password: ${spring.data.redis.password}
  ai:
    dashscope:
      # 从环境变量读取 API Key，避免硬编码泄漏风险
      api-key: ${DASHSCOPE_API_KEY}
    ollama:
      base-url: http://${OLLAMA_HOST}:11434
      chat:
        options:
          model: qwen3.5:9b
    vectorstore:
      pgvector:
        initialize-schema: true
    mcp:
      client:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:postgresql://192.168.184.126:5433/vector_db
    username: goodskill
    password: Password123
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: 192.168.184.126:8848
  config:
    import:
      - optional:nacos:goodskill-common-connection.yml
      - optional:nacos:goodskill-common.yml

goodskill:
  ai:
    provider: dashscope
  kb:
    default-top-k: 4
  vectorstore:
    table-name: vector_store
    dimensions: 1024
